<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A private e-book and PDF reader. Your books stay on your device and it works offline.">
<meta name="theme-color" content="#F1EFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marginalia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Marginalia Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,300..600;1,300..600&family=Instrument+Sans:wght@400..650&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar" aria-label="Navigation"></aside>
  <main id="main" class="main" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar" aria-label="Sections"></nav>
</div>
<div id="reader" class="reader" hidden></div>
<div id="drop" class="drop-overlay" hidden><div class="drop-inner">Drop books to add them to your library</div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<input id="file-input" type="file" multiple hidden>
<noscript><p style="padding:2rem;font-family:sans-serif">Marginalia needs JavaScript to run.</p></noscript>
<script type="module">
  import { boot } from './js/app.js';
  boot().catch((e) => {
    console.error(e);
    document.getElementById('main').innerHTML = '<div class="page"><h1>Marginalia couldn’t start</h1><p>' + String(e && e.message || e).replace(/</g, '&lt;') + '</p><p>Reload the page to try again.</p></div>';
  });
</script>
</body>
</html>
